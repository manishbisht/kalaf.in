name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages-deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        environment: github-pages
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v6

            - name: Compute CalVer
              id: version
              run: echo "version=$(date -u +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            # Unit, data and component tests. The dist/ smoke test skips
            # itself here because nothing is built yet.
            - name: Test
              run: yarn test

            - run: yarn build
              env:
                  VITE_BUILD_VERSION: ${{ steps.version.outputs.version }}
                  VITE_COMMIT_SHA: ${{ github.sha }}
                  VITE_CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

            - name: Test the prerendered site
              run: yarn test:dist

            # Browser tests (e2e/) against dist/; a failure stops the deploy.
            # The browser download is cached per Playwright version (pinned by
            # yarn.lock); --with-deps still installs Chromium's system libraries.
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: yarn test:e2e

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4

    release:
        needs: [build, deploy]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: v${{ needs.build.outputs.version }}
              run: |
                  gh release create "$TAG" \
                    --target "$GITHUB_SHA" \
                    --title "$TAG" \
                    --generate-notes
