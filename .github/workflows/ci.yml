# Lint, test and build every pull request (including the automatic
# catalog-sync PR), so problems show up before anything reaches main.
# Deploying stays in deploy.yml, on pushes to main.

name: CI

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Test
              run: yarn test

            - name: Build and prerender
              run: yarn build

            - name: Test the prerendered site
              run: yarn test:dist

            # Browser tests (e2e/) against dist/. The browser download is
            # cached per Playwright version (pinned by yarn.lock); --with-deps
            # still installs the system libraries Chromium needs.
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: yarn test:e2e

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
