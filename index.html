<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Web fonts: Inter, Space Grotesk and Tiro Devanagari Hindi from
             Google Fonts, Clash Display (600 is the only weight used) from
             Fontshare. The stylesheets load without blocking the first
             render (media="print", switched to "all" once loaded); the faces
             use font-display: swap anyway, so text shows in the fallback
             font until they arrive. Preconnects open the connections early. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://api.fontshare.com" />
        <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <link
            rel="stylesheet"
            href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap"
            />
            <link
                rel="stylesheet"
                href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap"
            />
        </noscript>

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#000000" />

        <!-- Per-route title, description, canonical, Open Graph and JSON-LD.
             scripts/prerender.mjs replaces this block in every built page;
             at runtime <Seo /> (src/seo) takes over. -->
        <!--seo-->
        <title data-seo>
            Kalaf — Cotton Trousers &amp; Bandhani Dupattas from Jaipur
        </title>
        <!--/seo-->
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
